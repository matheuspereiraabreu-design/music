<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="musicappear">
      <img class="imagem" src="tltxcg5.jpeg" />
    </div>

    <div>
      <audio
        id="musica"
        src="The Living Tombstone × CG5 - Temporary Love - The Living Tombstone.mp3"
      ></audio>

      <div class="letras-box">
        <div id="letraTotal" class="letras">
        </div>
      </div>
    </div>

    <div class="play">
      <img id="capaPlayer" src="tltxcg5.jpeg" />
      <h1 class="titulo">
        <strong id="tituloMusica">Temporary Love</strong>
      </h1>
      <h2 id="artistaMusica" class="cantor">The Living Tombstone × CG5</h2>

      <div class="barra-container">
        <span id="tempoAtual">0:00</span>
        <input type="range" id="barra" value="0" min="0" max="100" />
        <span id="tempoTotal">0:00</span>
      </div>
      <button id="playBtn">▶</button>
    </div>

    <div class="choseMusic" aria-label="Escolher música">
      <button class="songButton ativa" data-song="temporaryLove">Temporary Love</button>
      <button class="songButton" data-song="ballad">Ballad of the Walking Machines</button>
    </div>


    <script src="main.js"></script>
  </body>
</html>
